# MLX-OpenAI-Server configuration
# All models are on_demand: true — the profile decides what gets used/pulled.
# A small machine never loads a large model; the first request triggers download.
#
# Install:  uv pip install mlx-openai-server
# Run:      mlx-openai-server launch --config ~/.config/mlx-server/config.yaml

server:
  host: "127.0.0.1"
  port: 8000
  log_level: INFO

models:
  # Tiny model to verify server works — always loaded (1.7GB, CACHED)
  - model_path: mlx-community/Llama-3.2-3B-Instruct-4bit
    model_type: lm
    served_model_name: llama-3b
    context_length: 8192

  # Fast general-purpose MoE — on demand (~2GB active params, ~8GB weight)
  - model_path: mlx-community/Qwen3.5-35B-A3B-4bit
    model_type: lm
    served_model_name: qwen3.5-fast
    context_length: 65536
    prompt_cache_size: 10
    on_demand: true
    on_demand_idle_timeout: 300

  # Small model for the 32gb tier's text tasks — on demand.
  # Served as `lm`, NOT multimodal: mlx-openai-server's multimodal (VLM)
  # generation path is broken by the mlx 0.31.2 thread-local-stream bug
  # (mlx-lm #1256) — VLM requests hang and RPC-timeout with no output
  # (verified with ui-venus on a clean server). As `lm` this serves text
  # fine (verified, 4s). 32gb vision routes to GGUF qwen3.8:27b (Ollama).
  - model_path: mlx-community/Qwen3.5-9B-4bit
    model_type: lm
    served_model_name: qwen3.5-small
    context_length: 32768
    on_demand: true
    on_demand_idle_timeout: 300

  # Speech-to-text (turbo) — ~6x faster than v3, near-identical accuracy
  - model_path: mlx-community/whisper-large-v3-turbo
    model_type: whisper
    served_model_name: whisper-v3-turbo
    on_demand: true
    on_demand_idle_timeout: 300

  # Computer use (UI-Venus) — GUI grounding, ~8B
  - model_path: mlx-community/UI-Venus-1.5-8B-bf16
    model_type: multimodal
    served_model_name: ui-venus
    context_length: 32768
    on_demand: true
    on_demand_idle_timeout: 300

  # Uncensored chat 6-bit (22.8GB) — subfolder repo, so a local dir filled by the auto-puller (path machine-expanded on install); lm not multimodal: VLM path hangs (mlx-lm #1256)
  - model_path: $HOME/.local/share/super-puppy/models/Qwen3.8-27B-Uncensored-MLX/6-bit
    model_type: lm
    served_model_name: qwen3.8-uncensored-6bit
    context_length: 131072
    on_demand: true
    on_demand_idle_timeout: 300

  # Uncensored chat 8-bit (29.5GB) — subfolder repo, so a local dir filled by the auto-puller (path machine-expanded on install); lm not multimodal: VLM path hangs (mlx-lm #1256)
  - model_path: $HOME/.local/share/super-puppy/models/Qwen3.8-27B-Uncensored-MLX/8-bit
    model_type: lm
    served_model_name: qwen3.8-uncensored-8bit
    context_length: 131072
    on_demand: true
    on_demand_idle_timeout: 300
